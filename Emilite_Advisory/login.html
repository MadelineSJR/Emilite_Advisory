<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Emilite Advisory · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --navy:#10202F; --deep:#16302A; --deep-2:#1F5A48; --gold:#A9762A; --gold-2:#8A5F22;
    --paper:#F4F3EE; --ink:#1B2622; --muted:#66706B; --line:#DCDAD1; --danger:#9B3B26;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(ellipse at 50% 40%,#162b3e 0%,var(--navy) 60%);color:var(--ink);font-family:var(--sans);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;border-top:3px solid var(--gold)}
  .card{background:#fff;width:100%;max-width:440px;border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,.45);padding:44px 40px 34px;text-align:center}
  .logo{width:76px;height:76px;margin:0 auto 18px;display:block}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
  h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.1;margin:0 0 10px;color:var(--deep)}
  .sub{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 28px}
  .field{text-align:left;margin-bottom:18px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:3px;padding:13px 12px;font:16px var(--sans);color:var(--ink);outline:none;background:#fff}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,118,42,.15)}
  .pw{position:relative}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font:600 12px var(--sans);padding:6px 8px;cursor:pointer}
  .err{color:var(--danger);font-size:13px;font-weight:600;min-height:18px;margin:2px 0 10px;text-align:left}
  .btn{width:100%;padding:15px;border:0;border-radius:3px;background:var(--deep);color:#fff;font:600 16px var(--sans);cursor:pointer;letter-spacing:.01em}
  .btn:hover{background:var(--deep-2)}
  .btn:disabled{opacity:.6;cursor:progress}
  .foot{font-size:13px;color:var(--muted);line-height:1.5;margin:22px 0 0}
  .setup{display:none;background:#FBF1DC;border:1px solid #E5C98E;color:#6B4E14;border-radius:3px;padding:10px 12px;font-size:13px;line-height:1.45;text-align:left;margin:0 0 18px}
  @media (max-width:480px){.card{padding:34px 22px 28px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NiIgZmlsbD0iIzEwMjAyRiIgc3Ryb2tlPSIjQTk3NjJBIiBzdHJva2Utd2lkdGg9IjQiLz48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIzOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjQTk3NjJBIiBzdHJva2Utd2lkdGg9IjEiIG9wYWNpdHk9Ii42Ii8+PHRleHQgeD0iNTAiIHk9IjYyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iR2VvcmdpYSwgJ1RpbWVzIE5ldyBSb21hbicsIHNlcmlmIiBmb250LXNpemU9IjM0IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjRDlCMzZBIiBsZXR0ZXItc3BhY2luZz0iMSI+RUE8L3RleHQ+PC9zdmc+" alt="Emilite Advisory">
    <p class="eyebrow">Emilite Advisory</p>
    <h1>Agent Tools</h1>
    <p class="sub">Sign in with the account your administrator set up for you.</p>
    <div class="setup" id="setup">This page isn't connected to Supabase yet. Fill in <b>auth-config.js</b> with your project URL and anon key.</div>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="toggle" aria-label="Show password">Show</button></div></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="go" type="submit">Sign In</button>
    </form>
    <p class="foot">No account? Ask your administrator to create one for you.</p>
  </main>

<script src="auth-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
(function () {
  var cfg = window.EA_AUTH || {};
  var $ = function (id) { return document.getElementById(id); };
  var ready = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf("PASTE_") !== 0 && cfg.SUPABASE_ANON_KEY && cfg.SUPABASE_ANON_KEY.indexOf("PASTE_") !== 0;
  $("toggle").onclick = function () { var p = $("password"), show = p.type === "password"; p.type = show ? "text" : "password"; this.textContent = show ? "Hide" : "Show"; };
  if (!ready || !window.supabase) {
    $("setup").style.display = "block";
    if (ready && !window.supabase) $("setup").textContent = "Couldn't load the sign-in service. Check your internet connection and refresh.";
    $("go").disabled = true; return;
  }
  var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  var home = cfg.HOME_PAGE || "index.html";
  // Already signed in? Go straight to the tools.
  sb.auth.getUser().then(function (r) { if (r && r.data && r.data.user) location.replace(home); });
  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("email").value.trim(), password = $("password").value;
    $("err").textContent = "";
    if (!email || !password) { $("err").textContent = "Enter both email and password."; return; }
    var btn = $("go"); btn.disabled = true; btn.textContent = "Signing in…";
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) {
      btn.disabled = false; btn.textContent = "Sign In";
      $("err").textContent = /invalid/i.test(res.error.message) ? "That email and password don't match an approved account." : res.error.message;
      return;
    }
    location.replace(home);
  });
})();
</script>
</body>
</html>
