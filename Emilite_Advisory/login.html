<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Emilite Advisory · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --navy:#10202F; --deep:#16302A; --deep-2:#1F5A48; --gold:#A9762A; --wash:#E5EDE9;
    --ink:#1B2622; --muted:#66706B; --line:#DCDAD1; --danger:#9B3B26;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(ellipse at 50% 40%,#162b3e 0%,var(--navy) 60%);color:var(--ink);font-family:var(--sans);
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;border-top:3px solid var(--gold)}
  .card{background:#fff;width:100%;max-width:440px;border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,.45);padding:44px 40px 32px;text-align:center}
  .logo{width:76px;height:76px;margin:0 auto 18px;display:block}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
  h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.1;margin:0 0 10px;color:var(--deep)}
  .sub{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 26px}
  .field{text-align:left;margin-bottom:18px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:3px;padding:13px 12px;font:16px var(--sans);color:var(--ink);outline:none;background:#fff}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,118,42,.15)}
  .pw{position:relative}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font:600 12px var(--sans);padding:6px 8px;cursor:pointer}
  .msg{font-size:14px;line-height:1.45;border-radius:3px;padding:10px 12px;margin:0 0 14px;text-align:left;display:none}
  .msg.err{display:block;background:#F8E1DA;border:1px solid #E7AE9F;color:var(--danger);font-weight:600}
  .msg.info{display:block;background:var(--wash);border:1px solid #C3D6CD;color:var(--deep)}
  .msg.warn{display:block;background:#FBF1DC;border:1px solid #E5C98E;color:#6B4E14}
  .btn{width:100%;padding:15px;border:0;border-radius:3px;background:var(--deep);color:#fff;font:600 16px var(--sans);cursor:pointer}
  .btn:hover{background:var(--deep-2)}
  .btn:disabled{opacity:.6;cursor:progress}
  .foot{font-size:13px;color:var(--muted);line-height:1.5;margin:22px 0 0}
  @media (max-width:480px){.card{padding:34px 22px 28px}h1{font-size:28px}}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NiIgZmlsbD0iIzEwMjAyRiIgc3Ryb2tlPSIjQTk3NjJBIiBzdHJva2Utd2lkdGg9IjQiLz48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSIzOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjQTk3NjJBIiBzdHJva2Utd2lkdGg9IjEiIG9wYWNpdHk9Ii42Ii8+PHRleHQgeD0iNTAiIHk9IjYyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iR2VvcmdpYSwgJ1RpbWVzIE5ldyBSb21hbicsIHNlcmlmIiBmb250LXNpemU9IjM0IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjRDlCMzZBIiBsZXR0ZXItc3BhY2luZz0iMSI+RUE8L3RleHQ+PC9zdmc+" alt="Emilite Advisory">
    <p class="eyebrow">Emilite Advisory</p>
    <h1>Agent Tools</h1>
    <p class="sub">Sign in with the account your administrator set up for you.</p>
    <div class="msg" id="msg" role="status"></div>
    <form id="form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label>
        <div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="toggle" aria-label="Show password">Show</button></div></div>
      <button class="btn" id="go" type="submit">Sign In</button>
    </form>
    <p class="foot">No account? Ask your administrator to add you.</p>
  </main>
<script>
/* Shared by login.html, index.html and admin.html (inlined into each). */
window.EA = (function () {
  var ITER = 210000, SESSION_KEY = "ea-session", SESSION_HOURS = 12;
  var enc = new TextEncoder();
  function b64(buf) { var s = "", b = new Uint8Array(buf); for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function hash(password, saltB64, iter) {
    var key = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter || ITER, hash: "SHA-256" }, key, 256);
    return b64(bits);
  }
  function newSalt() { var u = new Uint8Array(16); crypto.getRandomValues(u); return b64(u); }
  async function makeUser(email, name, password, role) {
    var salt = newSalt();
    return { email: email.trim().toLowerCase(), name: (name || "").trim(), role: role || "agent", active: true, salt: salt, iter: ITER, hash: await hash(password, salt, ITER), added: (function (d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })(new Date()) };
  }
  function users() { return (window.EA_USERS || []).slice(); }
  function find(email) { email = (email || "").trim().toLowerCase(); return users().find(function (u) { return u.email === email; }); }
  async function check(email, password) {
    var u = find(email); if (!u || !u.active) return null;
    var h = await hash(password, u.salt, u.iter);
    return h === u.hash ? u : null;
  }
  function startSession(u) { try { localStorage.setItem(SESSION_KEY, JSON.stringify({ email: u.email, tag: u.hash.slice(0, 16), exp: Date.now() + SESSION_HOURS * 3600e3 })); } catch (e) { } }
  function endSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) { } }
  // A session only counts while the person is still active in users.js with the same password.
  function current() {
    try {
      var s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      if (!s || s.exp < Date.now()) return null;
      var u = find(s.email);
      return u && u.active && u.hash.slice(0, 16) === s.tag ? u : null;
    } catch (e) { return null; }
  }
  // Always load the newest users.js (skip the browser cache).
  function loadUsers() {
    return new Promise(function (res) {
      var s = document.createElement("script"); s.src = "users.js?t=" + Date.now();
      s.onload = function () { res(true); }; s.onerror = function () { res(false); };
      document.head.appendChild(s);
    });
  }
  return { hash: hash, makeUser: makeUser, users: users, find: find, check: check, startSession: startSession, endSession: endSession, current: current, loadUsers: loadUsers };
})();

</script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  function say(kind, text) { var m = $("msg"); m.className = "msg " + kind; m.textContent = text; }
  $("toggle").onclick = function () { var p = $("password"), show = p.type === "password"; p.type = show ? "text" : "password"; this.textContent = show ? "Hide" : "Show"; };
  var q = new URLSearchParams(location.search);
  if (q.get("signedout")) say("info", "You've signed out.");
  if (!window.crypto || !crypto.subtle) { say("err", "This browser can't sign in securely. Open the page over https (your GitHub Pages link)."); $("go").disabled = true; return; }
  var ok = await EA.loadUsers();
  if (!ok || !EA.users().length) { say("warn", "No accounts are set up yet. The administrator needs to create the first account on admin.html and upload users.js."); $("go").disabled = true; return; }
  if (EA.current()) { location.replace("index.html"); return; }
  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("email").value, password = $("password").value;
    if (!email.trim() || !password) { say("err", "Enter both email and password."); return; }
    var btn = $("go"); btn.disabled = true; btn.textContent = "Signing in…";
    var u = await EA.check(email, password);
    btn.disabled = false; btn.textContent = "Sign In";
    if (!u) { var f = EA.find(email); say("err", f && !f.active ? "This account has been switched off. Please contact your administrator." : "That email and password don't match an approved account."); return; }
    EA.startSession(u);
    location.replace(q.get("next") === "admin" && u.role === "admin" ? "admin.html" : "index.html");
  });
})();
</script>
</body>
</html>
