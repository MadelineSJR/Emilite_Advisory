<style>
  :root{--navy:#10202F;--deep:#16302A;--deep-2:#1F5A48;--gold:#A9762A;--wash:#E5EDE9;--ink:#1B2622;--muted:#66706B;--line:#DCDAD1;--danger:#9B3B26;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(ellipse at 50% 40%,#162b3e 0%,var(--navy) 60%);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;border-top:3px solid var(--gold)}
  .card{background:#fff;width:100%;max-width:440px;border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,.45);padding:44px 40px 32px;text-align:center}
  .logo{width:76px;height:76px;margin:0 auto 18px;display:block}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
  h1{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1.1;margin:0 0 10px;color:var(--deep)}
  .sub{font-size:15px;color:var(--muted);line-height:1.5;margin:0 0 26px}
  .field{text-align:left;margin-bottom:18px}
  .field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line);border-radius:3px;padding:13px 12px;font:16px var(--sans);color:var(--ink);outline:none;background:#fff}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(169,118,42,.15)}
  .pw{position:relative}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font:600 12px var(--sans);padding:6px 8px;cursor:pointer}
  .msg{font-size:14px;line-height:1.45;border-radius:3px;padding:10px 12px;margin:0 0 14px;text-align:left;display:none}
  .msg.err{display:block;background:#F8E1DA;border:1px solid #E7AE9F;color:var(--danger);font-weight:600}
  .msg.info{display:block;background:var(--wash);border:1px solid #C3D6CD;color:var(--deep)}
  .btn{width:100%;padding:15px;border:0;border-radius:3px;background:var(--deep);color:#fff;font:600 16px var(--sans);cursor:pointer}
  .btn:hover{background:var(--deep-2)}
  .btn:disabled{opacity:.6;cursor:progress}
  .foot{font-size:13px;color:var(--muted);line-height:1.5;margin:22px 0 0}
  #card{visibility:hidden}
  @media (max-width:480px){.card{padding:34px 22px 28px}h1{font-size:28px}}
</style>

<script>
/* Emilite Advisory vault – encryption helpers (Web Crypto: PBKDF2-SHA256 + AES-256-GCM). */
window.EAV = (function () {
  var ITER = 250000, ID_ITER = 120000, SESSION = "ea-session", HOURS = 12;
  var te = new TextEncoder(), td = new TextDecoder();
  function b64(buf) { var b = new Uint8Array(buf), s = "", CH = 0x8000; for (var i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH)); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function rand(n) { var u = new Uint8Array(n); crypto.getRandomValues(u); return u; }
  async function pbkdf2(text, saltB64, iter) {
    var k = await crypto.subtle.importKey("raw", te.encode(text), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(saltB64), iterations: iter, hash: "SHA-256" }, k, 256));
  }
  async function aesKey(raw) { return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]); }
  async function seal(rawKey, text) { var iv = rand(12); var ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, await aesKey(rawKey), te.encode(text)); return b64(iv) + "." + b64(ct); }
  async function open(rawKey, box) { var p = box.split("."); var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(p[0]) }, await aesKey(rawKey), unb64(p[1])); return td.decode(pt); }
  function norm(e) { return String(e || "").trim().toLowerCase(); }
  async function idFor(email, vault) { return b64(await pbkdf2("ea-id:" + norm(email), vault.salt, vault.idIter || ID_ITER)); }
  // One sign-in entry: the site key, wrapped with a key made from this person's email + password.
  async function makeEntry(vault, siteKeyB64, person, password) {
    var salt = b64(rand(16));
    var kek = await pbkdf2(norm(person.email) + "\u0000" + password, salt, ITER);
    var box = await seal(kek, JSON.stringify({ k: siteKeyB64, email: norm(person.email), name: person.name || "", role: person.role || "agent" }));
    return { id: await idFor(person.email, vault), salt: salt, iter: ITER, box: box };
  }
  async function unlock(vault, email, password) {
    var id = await idFor(email, vault);
    var e = (vault.users || []).find(function (u) { return u.id === id; });
    if (!e) return null;
    try {
      var kek = await pbkdf2(norm(email) + "\u0000" + password, e.salt, e.iter || ITER);
      var info = JSON.parse(await open(kek, e.box));
      info.id = id; return info;
    } catch (x) { return null; }
  }
  function saveSession(info) { try { localStorage.setItem(SESSION, JSON.stringify({ id: info.id, k: info.k, email: info.email, name: info.name, role: info.role, exp: Date.now() + HOURS * 3600e3 })); } catch (e) { } }
  function readSession() { try { var s = JSON.parse(localStorage.getItem(SESSION) || "null"); return s && s.exp > Date.now() ? s : null; } catch (e) { return null; } }
  function clearSession() { try { localStorage.removeItem(SESSION); } catch (e) { } }
  function loadVault() {
    return new Promise(function (res) {
      window.EA_VAULT = null;
      var s = document.createElement("script"); s.src = "users.js?t=" + Date.now();
      s.onload = function () { res(window.EA_VAULT || null); }; s.onerror = function () { res(null); };
      document.head.appendChild(s);
    });
  }
  return { b64: b64, unb64: unb64, rand: rand, seal: seal, open: open, norm: norm, idFor: idFor, makeEntry: makeEntry, unlock: unlock,
           saveSession: saveSession, readSession: readSession, clearSession: clearSession, loadVault: loadVault, ITER: ITER, ID_ITER: ID_ITER };
})();

</script>
<script>
(async function () {
  var $ = function (id) { return document.getElementById(id); };
  function say(kind, t) { var m = $("msg"); m.className = "msg " + kind; m.textContent = t; }
  function showForm() { $("card").style.visibility = "visible"; }
  async function enter(k) {
    var html = await EAV.open(EAV.unb64(k), $("eaPayload").textContent.trim());
    document.open(); document.write(html); document.close();
  }
  $("toggle").onclick = function () { var p = $("password"), s = p.type === "password"; p.type = s ? "text" : "password"; this.textContent = s ? "Hide" : "Show"; };
  if (!window.crypto || !crypto.subtle) { showForm(); say("err", "This browser can't open the tools securely. Use the https link."); $("go").disabled = true; return; }
  var q = new URLSearchParams(location.search);
  var vault = await EAV.loadVault();
  if (!vault) { showForm(); say("err", "Sign-in isn't available right now. Please try again later."); $("go").disabled = true; return; }
  var s = EAV.readSession();
  if (s && (vault.users || []).some(function (u) { return u.id === s.id; })) { try { await enter(s.k); return; } catch (e) { } }
  EAV.clearSession(); showForm();
  if (q.get("signedout")) say("info", "You've signed out.");
  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("email").value, pw = $("password").value;
    if (!email.trim() || !pw) { say("err", "Enter both email and password."); return; }
    var b = $("go"); b.disabled = true; b.textContent = "Signing in…";
    var info = await EAV.unlock(vault, email, pw);
    if (!info) { b.disabled = false; b.textContent = "Sign In"; say("err", "That email and password don't match an approved account."); return; }
    EAV.saveSession(info);
    try { if (history.replaceState) history.replaceState(null, "", location.pathname + location.hash); await enter(info.k); }
    catch (x) { b.disabled = false; b.textContent = "Sign In"; say("err", "Couldn't open the tools. Ask your administrator to rebuild index.html."); }
  });
})();
</script>
